<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="100" cy="550" r="200" fill="rgba(255,255,255,0.03)" />
  <circle cx="1100" cy="80" r="250" fill="rgba(255,255,255,0.03)" />
  <circle cx="600" cy="315" r="300" fill="rgba(255,255,255,0.02)" />

  <!-- Medical cross icon -->
  <g transform="translate(600, 120)">
    <rect x="-8" y="-40" width="16" height="80" rx="4" fill="rgba(255,255,255,0.15)" />
    <rect x="-40" y="-8" width="80" height="16" rx="4" fill="rgba(255,255,255,0.15)" />
  </g>

  <!-- Accent line -->
  <rect x="440" y="240" width="320" height="4" rx="2" fill="url(#accent)" />

  <!-- Title -->
  <text x="600" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Park Sonoscan Clinic
  </text>

  <!-- Subtitle -->
  <text x="600" y="355" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.8)" letter-spacing="1">
    NABH Accredited Multispeciality Hospital
  </text>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="300" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">
    Your Health, Our Priority
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="rgba(0,0,0,0.15)" />
  <text x="600" y="605" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.6)">
    parkclinickolkata.com  |  24/7 Emergency: +91 9775992022
  </text>
</svg>
